# nginx site configuration for the Threat Tiger container (SEC-007).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index threat-tiger.html;
    server_tokens off;
    charset utf-8;

    # Security headers. The page also carries its own Content-Security-Policy (script hash) in a <meta> tag;
    # this header adds the directives a <meta> tag cannot set (frame-ancestors) — both policies apply.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = / { return 302 /threat-tiger.html; }

    # Never serve hidden files (.git, .env, ...).
    location ~ /\. { return 404; }

    # The page and templates must always be fresh; versioned assets can be cached.
    # (expires sets Cache-Control without add_header, so the security headers above stay in effect.)
    location ~* \.(html|json)$ { expires -1; try_files $uri =404; }
    location ^~ /vendor/ { expires 30d; try_files $uri =404; }
    location / { expires 1d; try_files $uri =404; }
}
